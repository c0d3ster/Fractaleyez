# Pushes each workspace package to its standalone mirror repo when main changes it.
# The mirror only ever receives fast-forwards from here: if someone commits to a mirror
# directly, the push fails until that work is pulled back in with `git subtree pull`.
name: Mirror packages

on:
  push:
    branches: [main]
    paths: ['packages/**']
  workflow_dispatch:

# One run at a time. GitHub keeps only the newest pending run, so every run syncs every package
# from the commit it checked out instead of only the packages its own push changed: a run that
# replaces a pending one still carries that one's changes. A package with nothing new splits to
# the commit the mirror already has, and its push is a no-op.
concurrency:
  group: mirror-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # A manual run started from another branch would split that branch and push it to the mirror's
    # main, so only main is mirrored, whichever way the run started.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # To add a package: one entry here, a deploy key with write access on the mirror, its
          # private half saved as a secret in this repo, and that secret named in DEPLOY_KEY below.
          - prefix: packages/sprite-strip
            repo: c0d3ster/sprite-strip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split subtree
        env:
          PREFIX: ${{ matrix.prefix }}
        run: git subtree split --prefix="$PREFIX" -b mirror

      - name: Push to mirror
        env:
          # Each package's key by name, so the job gets only the secret it uses (a secrets[...] lookup
          # hands the runner every secret in the repo).
          DEPLOY_KEY: ${{ matrix.prefix == 'packages/sprite-strip' && secrets.SPRITE_STRIP_DEPLOY_KEY || '' }}
          REPO: ${{ matrix.repo }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::No deploy key for $REPO (see the matrix comment)"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND='ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes' \
            git push "git@github.com:$REPO.git" mirror:main
