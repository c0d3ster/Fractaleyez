# Publishes each workspace package to npm when main has a version of it npm does not.
# Bump "version" in the package's package.json to release it; a push that leaves the version alone
# publishes nothing. The package's typecheck, tests and build run first.
name: Publish packages

on:
  push:
    branches: [main]
    paths: ['packages/**']
  workflow_dispatch:

# One run at a time; GitHub keeps only the newest pending run, and every run checks every package
# against npm, so a replaced run's version bump is still published by the one that replaced it.
concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Only main publishes, also for a manual run started from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # To add a package: one entry here. The npm token must be able to publish it.
          - dir: packages/sprite-strip
    steps:
      - uses: actions/checkout@v4

      - name: Check npm for this version
        id: version
        working-directory: ${{ matrix.dir }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.publish == 'true'

      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # Built here, not left to prepublishOnly: pnpm does not always run it, and a publish without dist/ ships an empty package.
      - name: Typecheck, test and build
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          test -f dist/index.js && test -f dist/index.cjs && test -f dist/index.d.ts

      - name: Publish ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set"
            exit 1
          fi
          pnpm publish --no-git-checks
