# Publishes each workspace package to npm when main has a version of it npm does not.
# Bump "version" in the package's package.json to release it; a push that leaves the version alone
# publishes nothing. The package's typecheck, tests and build run first.
#
# No npm token: npm trusts this workflow through trusted publishing (OIDC). Each package lists it on
# npmjs.com under Settings, Trusted Publisher: GitHub Actions, owner c0d3ster, repository Fractaleyez,
# workflow publish-packages.yml. npm then attaches provenance, which needs the package's
# repository.url to be this repo (with "directory" for the package's folder).
name: Publish packages

on:
  push:
    branches: [main]
    paths: ['packages/**']
  workflow_dispatch:

# One run at a time; GitHub keeps only the newest pending run, and every run checks every package
# against npm, so a replaced run's version bump is still published by the one that replaced it.
concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Only main publishes, also for a manual run started from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm's trusted publishing exchanges for a one-off publish credential.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # To add a package: one entry here, and this workflow added as its trusted publisher on npmjs.com.
          - dir: packages/sprite-strip
    steps:
      - uses: actions/checkout@v4

      - name: Check npm for this version
        id: version
        working-directory: ${{ matrix.dir }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.publish == 'true'

      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm
          # No registry-url: with it, setup-node writes an .npmrc that sends NODE_AUTH_TOKEN, which it fills with a placeholder
          # when there is no token, and npm publishes with that instead of trusted publishing (the registry answers 404).

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # Built here, not left to prepublishOnly: pnpm does not always run it, and a publish without dist/ ships an empty package.
      - name: Typecheck, test and build
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          test -f dist/index.js && test -f dist/index.cjs && test -f dist/index.d.ts

      - name: Publish ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.dir }}
        # npm, not pnpm: trusted publishing needs npm 11.5.1 or later. The package has no workspace: dependencies for pnpm to
        # rewrite, and dist/ was built and checked above, so its own build script is skipped.
        run: |
          npm install -g npm@^11.5.1
          npm publish --ignore-scripts
