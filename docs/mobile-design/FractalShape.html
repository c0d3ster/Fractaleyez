    <div style="position: absolute; width: 400px; height: 400px; border-radius: 50%; border: 3px solid #E8E22A"></div>

  <div role="dialog" aria-label="Menu" style="position: absolute; left: 0; right: 0; top: 470px; bottom: 0; padding: 10px 16px 24px; border-radius: 22px 22px 0 0; background: rgba(14,14,14,0.96); border-top: 1px solid #333; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 6px">

      <div aria-hidden="true" style="position: relative; height: 28px; border-radius: 20px; background: #555; box-shadow: 0 1px 0 rgba(0,0,0,0.75)"><div style="position: absolute; top: 2.5px; left: calc((100% - 40px) * 0.50); width: 40px; height: 23px; border-radius: 20px; background: rgba(220,220,220,0.9)"></div></div>

          <circle cx="101" cy="58" r="7" fill="none" stroke="#fff" stroke-width="2"></circle>
          <circle cx="103" cy="64" r="3.5" fill="#ff5fa2"></circle>
        </svg>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <span role="group" aria-label="Shape mode" style="display: flex; gap: 6px"><button aria-pressed="true" style="flex: 1; height: 30px; background: #0a8f78; border: 1px solid #0a8f78; color: #fff; border-radius: 999px; font: 500 12px Inter, sans-serif">Tour</button><button aria-pressed="false" style="flex: 1; height: 30px; background: transparent; border: 1px solid #FFA032; color: #FFD3A0; border-radius: 999px; font: 500 12px Inter, sans-serif">✦ Manual</button></span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px"><button style="height: 32px; border-radius: 999px; background: transparent; border: 1px solid #888; color: #DDD; font: 500 13px Inter, sans-serif">San Marco</button><button style="height: 32px; border-radius: 999px; background: transparent; border: 1px solid #888; color: #DDD; font: 500 13px Inter, sans-serif">Rabbit</button><button style="height: 32px; border-radius: 999px; background: transparent; border: 1px solid #888; color: #DDD; font: 500 13px Inter, sans-serif">Airplane</button><button style="height: 32px; border-radius: 999px; background: transparent; border: 1px solid #888; color: #DDD; font: 500 13px Inter, sans-serif">Dendrite</button><button style="height: 32px; border-radius: 999px; background: transparent; border: 1px solid #888; color: #DDD; font: 500 13px Inter, sans-serif">Siegel disk</button><button style="height: 32px; border-radius: 999px; background: transparent; border: 1px solid #888; color: #DDD; font: 500 13px Inter, sans-serif">Basilica</button></div>
      </div>
    </div>
  </div>
</div>
